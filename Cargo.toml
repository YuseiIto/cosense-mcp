[package]
name = "cosense-mcp"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# The library target exists only so the two binaries can share code; it is not
# published and has no external callers. These three lints exist to hold public
# API documentation to a standard, and applying them here would mean writing
# `# Errors` and `#[must_use]` on internal helpers whose only caller is two
# files away.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[dependencies]
anyhow = "1.0.102"
arc-swap = "1.7"
axum = "0.8"
cosy = { version = "0.1.1", features = ["serde"] }
http = "1"
jsonwebtoken = "10"
lambda_http = { version = "0.13", default-features = false, features = ["apigw_http"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "1.6.0", features = ["server", "macros", "transport-io", "schemars", "transport-streamable-http-server", "server-side-http"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["macros", "rt-multi-thread", "io-std"] }
tower = { version = "0.4", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
urlencoding = "2.1.3"
